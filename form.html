<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Portal</h1>
    <form action="/register" method="post">
        <label for="">Full name:</label>
        <input type="text" name="fullName" id="fullName" placeholder="Enter your name">
        <br>
        <label for="">University Email:</label>
        <input type="email" name="universityEmail" id="universityEmail" placeholder="Enter your email"> <br>

        <label for="age">Age:</label>
        <input type="text" name="age" id="age" placeholder="Enter your age"> <br>

        <label for="dOB">DateOfBirth</label>
        <input type="date" name="dOB" id="dOB"> <br>

        <input type="radio" value="male" name="gender" id="male">
        <label for="male">Male</label>

         <input type="radio" value="female" name="gender" id="female">
        <label for="female">Female</label> <br>

        <label for="skills">Skills</label><br>

        <input type="checkbox" id="java" name="skills"> 
        <label for="java">java</label>
        <input type="checkbox" id="Python" name="skills">
        <label for="Python">Python</label>
        <br>
        <button type="submit">Submit</button>


        

    </form>
</body>
</html>
